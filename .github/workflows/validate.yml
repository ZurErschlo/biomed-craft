name: Check package

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check package files
        run: python scripts/validate_package.py
      - name: Run tests
        run: python -m unittest discover -s tests -v

  install-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check skill discovery
        run: npx --yes skills@1.7.2 add . --list
      - name: Check Claude Code plugin manifest
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.265
          claude plugin validate .
